<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/svg+xml" href="images/网页图标.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>waiseset的导航页</title>
    <style>
        /* 样式保持不变，此处省略以节省篇幅，请使用您之前的完整 CSS */
        /* 注意：需要新增 .home-view 样式，与 .sponsor-view 相同 */
        .home-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .home-view img {
            max-width: 90%;
            max-height: 70vh;
            height: auto;
            border-radius: var(--radius);
            box-shadow: var(--shadow-hover);
            background: #fff;
            padding: 10px;
        }
        .home-view .close-btn {
            background: var(--btn-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background var(--transition);
        }
        .home-view .close-btn:hover {
            background: var(--btn-hover);
        }
    </style>
</head>
<body>
    <!-- 侧边栏按钮改为 button -->
    <div class="sidebar-actions">
        <button class="btn" id="homeBtn">🏠 主页</button>
        <button class="btn btn-sponsor" id="sponsorBtn">❤️ 赞助</button>
    </div>

    <!-- 主内容区：默认视图、赞助视图、主页视图 -->
    <main class="main-content" id="mainContent">
        <div id="defaultView">
            <!-- ... 搜索、标题、卡片 ... -->
        </div>

        <div id="sponsorView" class="sponsor-view" style="display: none;">
            <!-- 赞助图片，备用本地路径 -->
            <img src="https://r2.image-upload.app/ptImg/LyPo7zfU.jpg" 
                 alt="赞助二维码"
                 onerror="this.onerror=null;this.src='images/赞助.svg';">
            <button class="close-btn" id="closeSponsorBtn">← 返回导航</button>
        </div>

        <!-- ★ 新增主页视图 ★ -->
        <div id="homeView" class="home-view" style="display: none;">
            <!-- 主页图片：请替换图床链接，备用为 images/主页.svg -->
            <img src="https://r2.image-upload.app/tyImg/rGkx0s2d.png" 
                 alt="主页图片"
                 onerror="this.onerror=null;this.src='images/主页.svg';">
            <button class="close-btn" id="closeHomeBtn">← 返回导航</button>
        </div>

        <p class="footer">© 2026 我的导航页 · 简洁即美</p>
    </main>

    <script>
        // 获取元素
        const defaultView = document.getElementById('defaultView');
        const sponsorView = document.getElementById('sponsorView');
        const homeView = document.getElementById('homeView');
        const sponsorBtn = document.getElementById('sponsorBtn');
        const homeBtn = document.getElementById('homeBtn');
        const closeSponsorBtn = document.getElementById('closeSponsorBtn');
        const closeHomeBtn = document.getElementById('closeHomeBtn');

        // 隐藏所有视图
        function hideAllViews() {
            defaultView.style.display = 'none';
            sponsorView.style.display = 'none';
            homeView.style.display = 'none';
        }

        // 显示主页视图
        homeBtn.addEventListener('click', () => {
            hideAllViews();
            homeView.style.display = 'flex';
        });

        // 显示赞助视图
        sponsorBtn.addEventListener('click', () => {
            hideAllViews();
            sponsorView.style.display = 'flex';
        });

        // 关闭主页视图
        closeHomeBtn.addEventListener('click', () => {
            hideAllViews();
            defaultView.style.display = 'block';
        });

        // 关闭赞助视图
        closeSponsorBtn.addEventListener('click', () => {
            hideAllViews();
            defaultView.style.display = 'block';
        });

        // 其余 JS 逻辑（导航、搜索等）保持不变 ...
    </script>
</body>
</html>
