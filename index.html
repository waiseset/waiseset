<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- ★ 修改：图标改为 .png，type 改为 image/png -->
    <link rel="icon" type="image/png" href="images/网页图标.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>waiseset的导航页</title>
    <!-- 拼音库 -->
    <script src="https://unpkg.com/pinyin-pro@3.18.2/dist/index.js"></script>
    <style>
        /* 样式不变，此处省略，实际需保留原样式的全部内容 */
        :root {
            --bg: #f0f2f5;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --text: #1d1d1f;
            --text-secondary: #6e6e73;
            --border: #e8e8ed;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-light: #eff6ff;
            --shadow: 0 1px 3px rgba(0,0,0,0.04),0 1px 2px rgba(0,0,0,0.06);
            --shadow-hover: 0 4px 16px rgba(0,0,0,0.08),0 2px 4px rgba(0,0,0,0.04);
            --shadow-card: 0 1px 3px rgba(0,0,0,0.05);
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
            --tag-bg: #f0f4ff;
            --tag-text: #3b66f6;
            --scrollbar-thumb: #c4c4c8;
            --scrollbar-track: transparent;
            --btn-bg: #f3f4f6;
            --btn-hover: #e5e7eb;
            --sidebar-width: 300px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1d;
                --sidebar-bg: #1f1f22;
                --card-bg: #252528;
                --text: #f0f0f2;
                --text-secondary: #a1a1a6;
                --border: #333336;
                --shadow: 0 1px 3px rgba(0,0,0,0.3);
                --shadow-hover: 0 4px 20px rgba(0,0,0,0.45);
                --shadow-card: 0 1px 3px rgba(0,0,0,0.25);
                --tag-bg: #2a3040;
                --tag-text: #7b9cf6;
                --scrollbar-thumb: #555558;
                --btn-bg: #333336;
                --btn-hover: #444448;
                --accent-light: #1e3050;
            }
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        .app-layout { display: flex; height: 100vh; width: 100%; }

        .sidebar {
            width: var(--sidebar-width); min-width: var(--sidebar-width);
            background: var(--sidebar-bg); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden;
            z-index: 10; padding: 24px 20px 20px; gap: 16px; scroll-behavior: smooth;
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }
        .sidebar { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent; }

        .sidebar-header { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
        .avatar {
            width: 68px; height: 68px; border-radius: 50%;
            background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0;
            overflow: hidden;
        }
        .avatar-img {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            top:0; left:0;
            z-index: 1;
        }
        .avatar-text {
            font-size: 30px; color:#fff; font-weight:600; z-index:0; user-select:none;
        }
        .sidebar-header h2 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
        .sidebar-header .bio { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.4; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .tag {
            display: inline-block; background: var(--tag-bg); color: var(--tag-text);
            font-size: 0.72rem; padding: 3px 10px; border-radius: 16px; font-weight: 500; white-space: nowrap;
        }

        .sidebar-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; gap: 5px; padding: 8px 14px;
            background: var(--btn-bg); color: var(--text); border-radius: 20px; text-decoration: none;
            font-size: 0.82rem; font-weight: 500; border: 1px solid var(--border);
            transition: background var(--transition),transform var(--transition); cursor: pointer; white-space: nowrap;
        }
        .btn:hover { background: var(--btn-hover); transform: translateY(-1px); }
        .btn-sponsor { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
        @media (prefers-color-scheme: dark) { .btn-sponsor { background:#3b1e1e; border-color:#7f1d1d; color:#fca5a5; } }

        .sidebar-divider { height: 1px; background: var(--border); margin: 4px 0; flex-shrink: 0; }
        .sidebar-nav-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); padding: 0 4px; font-weight: 600; }

        .nav-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
        .nav-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm);
            cursor: pointer; font-size: 0.9rem; font-weight: 500; color: var(--text);
            transition: background var(--transition),color var(--transition); border: none; background: none; width: 100%; text-align: left; position: relative;
        }
        .nav-item:hover { background: var(--btn-bg); }
        .nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 650; }
        .nav-item.active::before {
            content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background: var(--accent); border-radius: 0 3px 3px 0;
        }
        .nav-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .nav-badge { margin-left: auto; font-size: 0.72rem; color: var(--text-secondary); background: var(--btn-bg); padding: 2px 8px; border-radius: 10px; font-weight: 500; }
        .nav-item.active .nav-badge { background: var(--accent); color: #fff; }

        .icon-dev{background:#fef3c7}.icon-design{background:#fce7f3}.icon-learn{background:#d1fae5}
        .icon-tool{background:#e0e7ff}.icon-ai{background:#f3e8ff}.icon-social{background:#cffafe}
        .icon-game{background:#fed7aa}.icon-pc{background:#dbeafe}.icon-all{background:#e8e8ed}
        .icon-tg{background:#fde68a}

        .main-content {
            flex: 1; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden;
            padding: 28px 32px 40px; background: var(--bg); scroll-behavior: smooth;
            position: relative;
        }
        .main-content::-webkit-scrollbar { width: 6px; }
        .main-content::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }
        .main-content { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent; }

        .search-wrapper { margin-bottom: 20px; position: relative; max-width: 500px; }
        .search-input {
            width: 100%; padding: 12px 16px 12px 42px; border: 1px solid var(--border); border-radius: 26px;
            background: var(--card-bg); color: var(--text); font-size: 0.9rem; outline: none;
            transition: box-shadow var(--transition),border-color var(--transition); box-shadow: var(--shadow-card);
        }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 1rem; pointer-events: none; }
        .search-info { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 16px; display: none; }
        .search-info.visible { display: block; }

        .content-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .link-grid {
            display: grid; grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); gap: 14px; padding-bottom: 20px;
            padding-right: 40px;
        }
        .link-card {
            background: var(--card-bg); border-radius: var(--radius); padding: 20px 16px; text-align: center;
            text-decoration: none; color: var(--text); box-shadow: var(--shadow-card); border: 1px solid var(--border);
            transition: box-shadow var(--transition),transform var(--transition),border-color var(--transition);
            display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer;
            opacity: 0; animation: cardFadeIn 0.35s ease-out forwards;
            position: relative;
        }
        .link-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-3px); border-color: var(--accent); }
        .link-card .card-icon {
            width: 48px; height: 48px; border-radius: 14px; background: #e8e8ed;
            display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;
            color: #555; flex-shrink: 0; transition: background var(--transition),color var(--transition);
        }
        .link-card:hover .card-icon { background: var(--accent); color: #fff; }
        .link-card .card-name { font-size: 0.85rem; font-weight: 500; line-height: 1.3; word-break: break-word; }

        .copy-btn {
            position: absolute; top: 6px; right: 8px;
            background: none; border: none;
            color: var(--text-secondary); font-size: 1rem;
            cursor: pointer; opacity: 0.5;
            transition: opacity 0.2s, color 0.2s; z-index: 2;
        }
        .copy-btn:hover { opacity: 1; color: var(--accent); }
        .copy-btn.copied { opacity: 1; color: #22c55e; }

        .link-card.highlight {
            border-color: var(--accent) !important;
            box-shadow: 0 0 16px var(--accent) !important;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        @keyframes cardFadeIn {
            from { opacity:0; transform:translateY(12px); }
            to { opacity:1; transform:translateY(0); }
        }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state .empty-icon { font-size: 56px; margin-bottom: 14px; opacity: 0.6; }

        .image-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .image-view img { max-width: 90%; max-height: 70vh; height: auto; border-radius: var(--radius); box-shadow: var(--shadow-hover); background: #fff; padding: 10px; }
        #secretImageView { position: absolute; top:0; left:0; right:0; bottom:0; padding:16px 20px; background:var(--bg); display:none; flex-direction:column; z-index:5; }
        .secret-container { flex:1; display:flex; flex-direction:column; overflow:hidden; }
        .secret-tabs { display:flex; flex-wrap:wrap; gap:8px; padding:0 0 12px; margin-bottom:4px; justify-content:flex-start; }
        .secret-tabs button { padding:8px 18px; background:var(--card-bg); border:1px solid var(--border); border-radius:20px; font-size:0.85rem; color:var(--text); cursor:pointer; transition:background var(--transition),color var(--transition); white-space:nowrap; }
        .secret-tabs button:hover { background:var(--btn-hover); }
        .secret-tabs button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
        .secret-image-area {
            flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding:16px;
            background:var(--card-bg); border-radius:var(--radius); border:1px solid var(--border);
            overflow-y:auto; align-content:start; min-height:0;
        }
        .image-box {
            aspect-ratio: 4 / 3;
            overflow: hidden;
            border-radius: 8px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            padding: 4px;
        }
        .placeholder-text { grid-column:1/-1; text-align:center; color:var(--text-secondary); padding:40px; }
        .lightbox { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.9); z-index:200; align-items:center; justify-content:center; flex-direction:column; }
        .lightbox.active { display:flex; }
        .lightbox img { max-width:95vw; max-height:90vh; object-fit:contain; background:#fff; padding:10px; border-radius:12px; }
        .lightbox-close { position:absolute; top:20px; right:30px; font-size:36px; color:#fff; cursor:pointer; background:none; border:none; }
        .lightbox-close:hover { color:var(--accent); }
        .footer { text-align:center; margin-top:auto; padding-top:24px; color:var(--text-secondary); font-size:0.75rem; letter-spacing:0.02em; }

        .sidebar-toggle { display:none; position:fixed; top:12px; left:12px; z-index:100; width:40px; height:40px; border-radius:20px; background:var(--card-bg); border:1px solid var(--border); font-size:20px; cursor:pointer; box-shadow:var(--shadow); color:var(--text); align-items:center; justify-content:center; }
        .sidebar-overlay { display:none; position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.4); z-index:9; }
        .sidebar-overlay.active { display:block; }
        .alphabet-bar {
            position:fixed; right:16px; top:50%; transform:translateY(-50%);
            display:flex; flex-direction:column; gap:2px; z-index:20;
            background:rgba(255,255,255,0.5); backdrop-filter:blur(4px);
            padding:6px 3px; border-radius:20px; box-shadow:0 2px 8px rgba(0,0,0,0.08);
        }
        @media (prefers-color-scheme:dark) { .alphabet-bar { background:rgba(40,40,42,0.6); } }
        .alphabet-bar button {
            display:block; width:26px; height:26px; border:none; background:transparent;
            color:var(--text-secondary); font-size:0.7rem; font-weight:600; cursor:pointer;
            border-radius:50%; transition:background var(--transition),color var(--transition),opacity var(--transition);
            text-align:center; line-height:26px; padding:0;
        }
        .alphabet-bar button:hover { background:var(--accent-light); color:var(--accent); }
        .alphabet-bar button:active { background:var(--accent); color:#fff; }
        .alphabet-bar button.disabled { opacity:0.3; pointer-events:none; }

        @media (max-width:768px) {
            .alphabet-bar { display:none; } .link-grid { padding-right:0; }
            .app-layout { flex-direction:column; }
            .sidebar { position:fixed; top:0; left:-100%; width:280px; min-width:280px; height:100vh; z-index:50; transition:left 0.3s ease; border-right:1px solid var(--border); box-shadow:4px 0 20px rgba(0,0,0,0.15); padding-top:50px; }
            .sidebar.open { left:0; } .sidebar-toggle { display:flex; }
            .main-content { padding:18px 14px 30px; padding-top:56px; }
            .link-grid { grid-template-columns: repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
            .link-card { padding:16px 10px; gap:8px; }
            .link-card .card-icon { width:40px; height:40px; font-size:18px; border-radius:10px; }
            .link-card .card-name { font-size:0.78rem; }
            .search-wrapper { max-width:100%; }
            #secretImageView { padding:60px 10px 12px; }
            .secret-image-area { grid-template-columns:repeat(2,1fr); }
            .secret-tabs button { padding:7px 14px; font-size:0.8rem; }
        }
        @media (max-width:400px) {
            .link-grid { grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:8px; }
            .link-card { padding:14px 8px; gap:6px; }
            .link-card .card-icon { width:36px; height:36px; font-size:16px; border-radius:10px; }
            .link-card .card-name { font-size:0.73rem; }
            .secret-image-area { grid-template-columns:repeat(2,1fr); }
        }
    </style>
</head>
<body>

    <button class="sidebar-toggle" id="sidebarToggle" aria-label="菜单">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="avatar">
                    <!-- ★ 头像图片改为 .jpg -->
                    <img class="avatar-img" src="images/头像.jpg" alt="头像"
                         onload="this.style.display='';this.nextElementSibling.style.display='none';"
                         onerror="this.style.display='none';this.nextElementSibling.style.display='';">
                    <span class="avatar-text">W</span>
                </div>
                <h2>waiseset</h2>
                <p class="bio">数码爱好者 刷机爱好者 魔方爱好者 游戏爱好者</p>
                <div class="tags">
                    <span class="tag">电脑配置/优化</span><span class="tag">刷机/玩机</span>
                    <span class="tag">游戏</span><span class="tag">Python</span><span class="tag">魔方</span>
                </div>
            </div>
            <div class="sidebar-actions">
                <button class="btn" id="homeBtn">🏠 主页</button>
                <button class="btn btn-sponsor" id="sponsorBtn">❤️ 赞助</button>
            </div>
            <div class="sidebar-divider"></div>
            <span class="sidebar-nav-label">分类导航</span>
            <ul class="nav-list" id="navList"></ul>
        </aside>

        <main class="main-content" id="mainContent">
            <div id="defaultView">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="输入汉字或拼音搜索（支持空格）…">
                </div>
                <p class="search-info" id="searchInfo"></p>
                <div class="content-title" id="contentTitle">🗂️ 全部链接</div>
                <div class="link-grid" id="linkGrid"></div>
            </div>
            <!-- ★ 赞助图片改为 .jpg，保留 onload/onerror -->
            <div id="sponsorView" class="image-view" style="display:none;">
                <img src="images/赞助.jpg" alt="赞助二维码"
                     onload="this.style.display='';"
                     onerror="this.style.display='none';">
            </div>
            <!-- ★ 主页图片改为 .png，保留 onload/onerror -->
            <div id="homeView" class="image-view" style="display:none;">
                <img src="images/主页.png" alt="主页图片"
                     onload="this.style.display='';"
                     onerror="this.style.display='none';">
            </div>
            <div id="secretImageView">
                <div class="secret-container">
                    <div class="secret-tabs" id="secretTabs"></div>
                    <div class="secret-image-area" id="secretImageArea"><p class="placeholder-text">请选择一个分区查看图片</p></div>
                </div>
            </div>
            <div id="secretLinksView" style="display:none; flex-direction:column; flex:1; padding:28px 32px; overflow-y:auto;">
                <h2 style="margin-bottom:20px;">🔮 隐藏网站</h2>
                <div class="link-grid" id="secretLinkGrid"></div>
            </div>
            <p class="footer">© 2026 我的导航页 · 简洁即美</p>
        </main>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <img src="" alt="查看图片" id="lightboxImg">
    </div>
    <nav class="alphabet-bar" id="alphabetBar"></nav>

    <script>
        // ==================== 完整分类数据 ====================
        const categories = [/* ... 数据保持不变，为节省篇幅此处省略，实际使用时请保留原完整数据 ... */];

        // 隐藏网站数据
        const secretLinks = [/* ... 数据保持不变，此处省略 ... */];

        // 隐藏图片分区数据
        const secretImageSections = [/* ... 数据保持不变，此处省略 ... */];

        // ==================== 全局状态 ====================
        let currentCategoryId = 'all';
        let isSearching = false;
        let homeClickCount = 0, sponsorClickCount = 0;
        const CLICK_LIMIT = 10;
        let homeClickTimer, sponsorClickTimer;

        const defaultView = document.getElementById('defaultView');
        const sponsorView = document.getElementById('sponsorView');
        const homeView = document.getElementById('homeView');
        const secretImageView = document.getElementById('secretImageView');
        const secretLinksView = document.getElementById('secretLinksView');

        function hideAllViews() {
            defaultView.style.display = 'none'; sponsorView.style.display = 'none'; homeView.style.display = 'none';
            secretImageView.style.display = 'none'; secretLinksView.style.display = 'none';
        }
        function showDefaultView() { hideAllViews(); defaultView.style.display = 'block'; }

        // 灯箱
        function openLightbox(src) { document.getElementById('lightboxImg').src = src; document.getElementById('lightbox').classList.add('active'); }
        function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }
        document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
        document.getElementById('lightbox').addEventListener('click', e => { if (e.target === e.currentTarget) closeLightbox(); });

        // 隐藏图片页渲染
        function renderSecretTabs() {
            const tabs = document.getElementById('secretTabs'); tabs.innerHTML = '';
            secretImageSections.forEach(section => {
                const btn = document.createElement('button'); btn.textContent = section.name;
                btn.addEventListener('click', () => {
                    tabs.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const area = document.getElementById('secretImageArea'); area.innerHTML = '';
                    section.images.forEach(img => {
                        const box = document.createElement('div'); box.className = 'image-box';
                        const imgEl = document.createElement('img'); imgEl.src = img.url; imgEl.alt = section.name;
                        imgEl.loading = 'lazy'; imgEl.addEventListener('click', () => openLightbox(img.url));
                        box.appendChild(imgEl); area.appendChild(box);
                    });
                });
                tabs.appendChild(btn);
            });
        }

        // 隐藏网站页渲染（含复制按钮）
        function renderSecretLinks() {
            const grid = document.getElementById('secretLinkGrid'); grid.innerHTML = '';
            if (!secretLinks.length) { grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🔒</div><p>暂无隐藏网站</p></div>'; return; }
            secretLinks.forEach((link, i) => {
                const card = document.createElement('a'); card.className = 'link-card';
                card.href = link.url; card.target = '_blank'; card.rel = 'noopener noreferrer';
                card.title = link.name; card.style.animationDelay = (i * 0.03) + 's';
                card.innerHTML = `
                    <span class="card-icon">${link.name.charAt(0).toUpperCase()}</span>
                    <span class="card-name">${link.name}</span>
                    <button class="copy-btn" title="复制链接" data-url="${link.url}">📋</button>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('homeBtn').addEventListener('click', () => {
            homeClickCount++; clearTimeout(homeClickTimer); homeClickTimer = setTimeout(() => homeClickCount=0, 5000);
            if (homeClickCount >= CLICK_LIMIT) { homeClickCount=0; clearTimeout(homeClickTimer); hideAllViews(); secretImageView.style.display='flex'; renderSecretTabs(); const first=document.querySelector('#secretTabs button'); if(first) first.click(); else document.getElementById('secretImageArea').innerHTML='<p class="placeholder-text">暂无分区内容</p>'; return; }
            homeView.style.display === 'flex' ? showDefaultView() : (hideAllViews(), homeView.style.display = 'flex');
        });
        document.getElementById('sponsorBtn').addEventListener('click', () => {
            sponsorClickCount++; clearTimeout(sponsorClickTimer); sponsorClickTimer = setTimeout(() => sponsorClickCount=0, 5000);
            if (sponsorClickCount >= CLICK_LIMIT) { sponsorClickCount=0; clearTimeout(sponsorClickTimer); hideAllViews(); secretLinksView.style.display='flex'; renderSecretLinks(); return; }
            sponsorView.style.display === 'flex' ? showDefaultView() : (hideAllViews(), sponsorView.style.display = 'flex');
        });

        function renderNav() {
            const nav = document.getElementById('navList'); nav.innerHTML = '';
            const allItem = document.createElement('li'); allItem.className = 'nav-item'; allItem.dataset.catId = 'all';
            allItem.innerHTML = `<span class="nav-icon icon-all">🗂️</span><span>全部链接</span><span class="nav-badge">${categories.reduce((s,c)=>s+c.links.length,0)}</span>`;
            allItem.addEventListener('click', () => selectCategory('all')); nav.appendChild(allItem);
            categories.forEach(cat => {
                const item = document.createElement('li'); item.className = 'nav-item'; item.dataset.catId = cat.id;
                item.innerHTML = `<span class="nav-icon ${cat.iconClass}">${cat.iconEmoji}</span><span>${cat.name}</span><span class="nav-badge">${cat.links.length}</span>`;
                item.addEventListener('click', () => selectCategory(cat.id)); nav.appendChild(item);
            });
            updateNavActive();
        }
        function updateNavActive() {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('active', item.dataset.catId === currentCategoryId));
        }
        function updateSearchPlaceholder() {
            const input = document.getElementById('searchInput');
            if (currentCategoryId === 'all') input.placeholder = '输入汉字或拼音搜索（支持空格）…';
            else { const cat = categories.find(c => c.id === currentCategoryId); if (cat) input.placeholder = `在 ${cat.name} 中搜索…`; }
        }
        function selectCategory(catId) {
            currentCategoryId = catId; isSearching = false;
            document.getElementById('searchInput').value = '';
            document.getElementById('searchInfo').classList.remove('visible');
            updateSearchPlaceholder(); updateNavActive(); showDefaultView(); renderLinks();
            closeSidebar();
        }

        function getPinyinInfo(name) {
            if (typeof pinyinPro === 'undefined') { const lower = name.toLowerCase().replace(/\s+/g,''); return { full: lower, first: lower.charAt(0) || '' }; }
            try { const full = pinyinPro.pinyin(name,{pattern:'normal',toneType:'none'}).replace(/\s+/g,'').toLowerCase(); const first = pinyinPro.pinyin(name,{pattern:'first',toneType:'none'}).replace(/\s+/g,'').toLowerCase(); return {full, first}; }
            catch(e) { const lower = name.toLowerCase().replace(/\s+/g,''); return { full: lower, first: lower.charAt(0) || '' }; }
        }

        function matchesQuery(link, rawQuery) {
            if (!rawQuery) return true;
            const lowerName = link.name.toLowerCase();
            const pinyin = getPinyinInfo(link.name);
            const words = rawQuery.split(/\s+/).filter(w => w.length);
            return words.every(word => {
                if (word.length === 1 && word.match(/[a-z]/i)) {
                    const englishFirst = lowerName.charAt(0);
                    const pinyinFirst = pinyin.first.charAt(0);
                    return englishFirst === word || pinyinFirst === word;
                }
                return lowerName.includes(word) || pinyin.full.includes(word) || pinyin.first.includes(word);
            });
        }

        function sortLinks(links) {
            return links.sort((a, b) => {
                const pinyinA = getPinyinInfo(a.name), pinyinB = getPinyinInfo(b.name);
                const firstA = pinyinA.first.charAt(0) || a.name.charAt(0).toLowerCase();
                const firstB = pinyinB.first.charAt(0) || b.name.charAt(0).toLowerCase();
                if (firstA !== firstB) return firstA.localeCompare(firstB);
                return a.name.localeCompare(b.name, 'zh');
            });
        }

        function updateAlphabetBarState() {
            const existing = new Set();
            document.querySelectorAll('.link-card[data-pinyin-first]').forEach(card => {
                const ch = card.getAttribute('data-pinyin-first'); if (ch) existing.add(ch);
            });
            document.querySelectorAll('.alphabet-bar button').forEach(btn => {
                const letter = btn.textContent.toLowerCase();
                btn.classList.toggle('disabled', !existing.has(letter));
            });
        }

        function renderLinks(linksOverride) {
            const grid = document.getElementById('linkGrid'); const titleEl = document.getElementById('contentTitle'); grid.innerHTML = '';
            let linksToShow, titleText; const showCategory = true;
            if (linksOverride) { linksToShow = linksOverride; titleText = `🔍 搜索结果 (${linksToShow.length})`; }
            else if (currentCategoryId === 'all') { linksToShow = []; categories.forEach(cat => cat.links.forEach(link => linksToShow.push({...link, catName:cat.name, catEmoji:cat.iconEmoji}))); linksToShow = sortLinks(linksToShow); titleText = `🗂️ 全部链接 (${linksToShow.length})`; }
            else { const cat = categories.find(c => c.id === currentCategoryId); if (cat) { linksToShow = cat.links.map(l => ({...l, catName:cat.name, catEmoji:cat.iconEmoji})); linksToShow = sortLinks(linksToShow); titleText = `${cat.iconEmoji} ${cat.name}`; } else { linksToShow = []; titleText = ''; } }
            titleEl.textContent = titleText;
            if (!linksToShow.length) { grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>没有找到匹配的链接</p></div>'; updateAlphabetBarState(); return; }
            const fragment = document.createDocumentFragment();
            linksToShow.forEach((link, index) => {
                const card = document.createElement('a'); card.className = 'link-card';
                card.href = link.url; card.target = '_blank'; card.rel = 'noopener noreferrer';
                card.title = link.name; card.style.animationDelay = (index * 0.03) + 's';
                const firstChar = link.name.charAt(0).toUpperCase();
                const pinyin = getPinyinInfo(link.name);
                const pinyinFirst = pinyin.first.charAt(0) || firstChar.toLowerCase();
                card.setAttribute('data-pinyin-first', pinyinFirst);
                const catLabel = showCategory && link.catName ? `<span style="font-size:0.7rem;color:var(--text-secondary);margin-top:2px;">${link.catEmoji||''} ${link.catName}</span>` : '';
                card.innerHTML = `<span class="card-icon">${firstChar}</span><span class="card-name">${link.name}</span>${catLabel}<button class="copy-btn" title="复制链接" data-url="${link.url}">📋</button>`;
                fragment.appendChild(card);
            });
            grid.appendChild(fragment);
            updateAlphabetBarState();
        }

        document.addEventListener('click', async function(e) {
            const btn = e.target.closest('.copy-btn');
            if (!btn) return;
            e.preventDefault(); e.stopPropagation();
            const url = btn.getAttribute('data-url') || btn.parentElement.href;
            try { await navigator.clipboard.writeText(url); btn.classList.add('copied'); btn.textContent = '✓'; setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋'; }, 1000); }
            catch (err) { const textarea = document.createElement('textarea'); textarea.value = url; textarea.style.position = 'fixed'; textarea.style.opacity = '0'; document.body.appendChild(textarea); textarea.select(); document.execCommand('copy'); document.body.removeChild(textarea); btn.classList.add('copied'); btn.textContent = '✓'; setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋'; }, 1000); }
        });

        function setupSearch() {
            const searchInput = document.getElementById('searchInput'); const searchInfo = document.getElementById('searchInfo');
            searchInput.addEventListener('input', function() {
                if (defaultView.style.display === 'none') showDefaultView();
                const rawQuery = this.value.trim();
                if (!rawQuery) { isSearching = false; searchInfo.classList.remove('visible'); updateNavActive(); updateSearchPlaceholder(); renderLinks(); return; }
                if (rawQuery.startsWith('http://') || rawQuery.startsWith('https://')) { searchInfo.classList.add('visible'); searchInfo.textContent = '按回车键直接打开该网址'; return; }
                isSearching = true; const query = rawQuery.toLowerCase(); let results = [];
                if (currentCategoryId === 'all') { categories.forEach((cat, ci) => cat.links.forEach(link => { if (matchesQuery(link, query)) results.push({...link, catName:cat.name, catEmoji:cat.iconEmoji, catIndex:ci}); })); }
                else { const cat = categories.find(c => c.id === currentCategoryId); if (cat) { const ci = categories.indexOf(cat); cat.links.forEach(link => { if (matchesQuery(link, query)) results.push({...link, catName:cat.name, catEmoji:cat.iconEmoji, catIndex:ci}); }); } }
                results.sort((a, b) => { if (a.catIndex !== b.catIndex) return a.catIndex - b.catIndex; const pinyinA = getPinyinInfo(a.name), pinyinB = getPinyinInfo(b.name); const firstA = pinyinA.first.charAt(0) || a.name.charAt(0).toLowerCase(); const firstB = pinyinB.first.charAt(0) || b.name.charAt(0).toLowerCase(); if (firstA !== firstB) return firstA.localeCompare(firstB); return a.name.localeCompare(b.name, 'zh'); });
                searchInfo.classList.add('visible'); searchInfo.textContent = `找到 ${results.length} 个结果`;
                document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
                renderLinks(results);
            });
            searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { const value = this.value.trim(); if (value.startsWith('http://')||value.startsWith('https://')) { e.preventDefault(); window.open(value,'_blank'); this.value=''; selectCategory(currentCategoryId); } } });
        }

        function initAlphabetBar() {
            const bar = document.getElementById('alphabetBar'); const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''); bar.innerHTML = '';
            letters.forEach(letter => { const btn = document.createElement('button'); btn.textContent = letter; btn.addEventListener('click', () => { const target = document.querySelector(`.link-card[data-pinyin-first="${letter.toLowerCase()}"]`); if (!target || target.classList.contains('disabled')) return; document.querySelectorAll('.link-card.highlight').forEach(c => c.classList.remove('highlight')); target.scrollIntoView({ behavior: 'smooth', block: 'start' }); target.classList.add('highlight'); setTimeout(() => target.classList.remove('highlight'), 800); }); bar.appendChild(btn); });
            updateAlphabetBarState();
        }

        function setupMobile() {
            const sidebar = document.getElementById('sidebar'); const toggleBtn = document.getElementById('sidebarToggle'); const overlay = document.getElementById('sidebarOverlay');
            toggleBtn.addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('active'); toggleBtn.style.display = 'none'; });
            overlay.addEventListener('click', closeSidebar);
            document.getElementById('mainContent').addEventListener('click', e => { if (sidebar.classList.contains('open') && !e.target.closest('.sidebar-toggle')) closeSidebar(); });
        }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('active'); document.getElementById('sidebarToggle').style.display = ''; }

        document.addEventListener('DOMContentLoaded', () => {
            initAlphabetBar(); renderNav(); updateSearchPlaceholder(); renderLinks(); setupSearch(); setupMobile();
        });
    </script>
</body>
</html>
